<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STEM Nation | Arrival at the Academy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #07172b, #0d1f35 52%, #06101c);
      color: #f8f1dd;
      font-family: Georgia, "Times New Roman", serif;
    }
    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px;
    }
    .moon {
      position: absolute;
      top: 9%;
      right: 13%;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #f4d35e, #9e7b24);
      box-shadow: 0 0 80px rgba(244,211,94,.3);
      opacity: .9;
    }
    .cloud {
      position: absolute;
      width: 260px;
      height: 80px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      animation: drift 34s linear infinite;
    }
    .cloud.one { top: 18%; left: -270px; }
    .cloud.two { top: 30%; left: -360px; animation-duration: 48s; animation-delay: -10s; }
    @keyframes drift {
      to { transform: translateX(calc(100vw + 520px)); }
    }
    .academy {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 0;
      height: 42vh;
      background:
        linear-gradient(180deg, transparent 0 15%, rgba(244,211,94,.12) 15% 18%, transparent 18%),
        linear-gradient(180deg, #182d48, #07101d);
      clip-path: polygon(0 45%, 8% 30%, 16% 42%, 24% 18%, 32% 42%, 42% 28%, 50% 10%, 60% 35%, 70% 22%, 82% 40%, 92% 26%, 100% 44%, 100% 100%, 0 100%);
      opacity: .95;
    }
    .water {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 90px;
      background: repeating-linear-gradient(90deg, rgba(120,190,230,.22) 0 16px, transparent 16px 44px), #071827;
      animation: waterMove 4s linear infinite;
    }
    @keyframes waterMove {
      to { background-position: 120px 0; }
    }
    .card {
      position: relative;
      z-index: 3;
      width: min(860px, 92vw);
      padding: 34px;
      border-radius: 32px;
      background: rgba(5,12,24,.72);
      border: 1px solid rgba(244,211,94,.32);
      box-shadow: 0 25px 90px rgba(0,0,0,.5);
    }
    .kicker {
      color: #f4d35e;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 900;
      font-size: .78rem;
      margin-bottom: 12px;
    }
    h1 {
      color: #f4d35e;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: .9;
      margin: 0 0 18px;
    }
    .line {
      color: rgba(248,241,221,.86);
      font-size: clamp(1.1rem, 2.3vw, 1.55rem);
      line-height: 1.5;
      min-height: 78px;
      margin-bottom: 24px;
    }
    .button {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #f4d35e, #d7a51e);
      color: #171006;
      padding: 15px 20px;
      border-radius: 18px;
      font-weight: 900;
    }
    .hidden { display: none; }
  
/* CI-1E_ARRIVAL_TO_GATHERING_TRANSITION */
/* CI-2B_ARRIVAL_TIMING_POLISH */
.arrival-status {
  margin-top: 18px;
  color: #f4d35e;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-size: .78rem;
  font-weight: 900;
}

.bell-flash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(244,211,94,.34), transparent 46%);
  opacity: 0;
  pointer-events: none;
  transition: opacity .55s ease;
  z-index: 20;
}

.bell-flash.show {
  opacity: 1;
}

.movement-trail {
  position: fixed;
  left: 8%;
  right: 8%;
  bottom: 10%;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(244,211,94,.85), transparent);
  opacity: 0;
  transform: scaleX(.2);
  transform-origin: left center;
  transition: opacity .9s ease, transform 2.8s ease;
  z-index: 12;
}

.movement-trail.show {
  opacity: .9;
  transform: scaleX(1);
}



/* CI-2B_STUDENT_NAME_ARRIVAL */
/* CI-2B-FIX2_ARRIVAL_NAME_LAYOUT */
.arrival-identity-card {
  width: min(520px, 92vw);
  margin: 12px auto 22px;
  padding: 14px 18px;
  border: 1px solid rgba(244,211,94,.26);
  border-radius: 20px;
  background: rgba(0,0,0,.22);
  box-shadow: 0 12px 36px rgba(0,0,0,.22);
}

.arrival-stage {
  color: #d8cfb0;
  font-size: .78rem;
  font-weight: 900;
  letter-spacing: .18em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.arrival-student-name {
  color: #f4d35e;
  font-size: clamp(1.35rem, 3.2vw, 2.25rem);
  font-weight: 900;
  letter-spacing: .03em;
  line-height: 1.12;
  word-break: break-word;
  text-shadow: 0 8px 30px rgba(0,0,0,.55);
}

.line {
  max-width: 760px;
  margin: 18px auto 0;
  line-height: 1.55;
  min-height: 3.2em;
}

</style>
</head>
<body>
<div class="bell-flash" id="bellFlash" aria-hidden="true"></div>
<div class="movement-trail" id="movementTrail" aria-hidden="true"></div>
  <main class="scene">
    <div class="moon"></div>
    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="academy"></div>
    <div class="water"></div>

    <section class="card">
      <div class="kicker">Arrival at the Academy</div>
      <h1>You Have Arrived</h1>
      <div class="arrival-identity-card" id="arrivalIdentityCard">
        <div class="arrival-stage">New Arrival</div>
        <div class="arrival-student-name" id="arrivalStudentName">Academy Learner</div>
      </div>
      <div id="line" class="line">The Academy receives new arrivals quietly.</div>
      <a id="enterBtn" class="button hidden" href="/first_gathering">Follow the Gathering</a>
    </section>
  </main>

  <script>
    const STEM_NATION_IDENTITY_KEY = "stemNationStudentIdentity";
    let stemNationArrivalIdentity = {
      name: "Academy Learner",
      teacherApprovedName: "",
      approvedName: ""
    };

    try {
      const savedIdentity = JSON.parse(localStorage.getItem(STEM_NATION_IDENTITY_KEY) || "null");
      if (savedIdentity) {
        stemNationArrivalIdentity = { ...stemNationArrivalIdentity, ...savedIdentity };
      }
    } catch (error) {
      console.warn("Could not load STEM Nation identity for arrival.", error);
    }

    const arrivalDisplayName =
      stemNationArrivalIdentity.teacherApprovedName ||
      stemNationArrivalIdentity.approvedName ||
      stemNationArrivalIdentity.name ||
      "Academy Learner";

    const arrivalStudentName = document.getElementById("arrivalStudentName");
    if (arrivalStudentName) {
      arrivalStudentName.textContent = arrivalDisplayName;
    }

    const lines = [
      `The Academy receives ${arrivalDisplayName} quietly.`,
      "For a moment, everything feels still.",
      "Then a bell rings across the grounds.",
      "People begin moving toward the Council Hall.",
      "You follow the movement, not yet knowing what has happened."
    ];

    let i = 0;
    const line = document.getElementById("line");
    const enterBtn = document.getElementById("enterBtn");

    function nextLine() {
      i++;
      if (i < lines.length) {
        line.style.opacity = 0;
        setTimeout(() => {
          line.textContent = lines[i];
          line.style.opacity = 1;
        }, 350);
        setTimeout(nextLine, 2550);
      } else {
        setTimeout(() => enterBtn.classList.remove("hidden"), 1100);
      }
    }

    line.style.transition = "opacity .35s ease";
    setTimeout(nextLine, 1800);
  </script>
</body>
</html>
