<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STEM Nation | Development Reset</title>
  <style>
    :root {
      --gold: #f4d35e;
      --gold2: #d7a51e;
      --text: #f8f1dd;
      --muted: #d8cfb0;
      --panel: rgba(5, 12, 24, .86);
      --border: rgba(244, 211, 94, .30);
      --danger: #ff9b85;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 10%, rgba(244,211,94,.12), transparent 32%),
        radial-gradient(circle at 80% 0%, rgba(80,160,220,.16), transparent 36%),
        linear-gradient(180deg, #06111f, #0a192b 58%, #030914);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: min(820px, 96vw);
      border: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(244,211,94,.10), rgba(255,255,255,.035)),
        var(--panel);
      border-radius: 30px;
      padding: clamp(24px, 4vw, 42px);
      box-shadow: 0 28px 90px rgba(0,0,0,.34);
    }

    .kicker {
      color: var(--gold);
      letter-spacing: .16em;
      text-transform: uppercase;
      font-size: .78rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.1rem, 5vw, 4.2rem);
      line-height: .96;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .keys {
      margin: 18px 0;
      padding: 16px;
      border-radius: 18px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.12);
      color: #d8cfb0;
      line-height: 1.6;
      font-family: Consolas, Monaco, monospace;
      font-size: .92rem;
      max-height: 240px;
      overflow: auto;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button,
    .button {
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
    }

    .danger {
      background: linear-gradient(135deg, var(--danger), #d85f4f);
      color: #160806;
      box-shadow: 0 12px 36px rgba(255,155,133,.20);
    }

    .primary {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #171006;
      box-shadow: 0 12px 36px rgba(244,211,94,.20);
    }

    .secondary {
      background: rgba(255,255,255,.10);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.16);
    }

    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(244,211,94,.10);
      border: 1px solid rgba(244,211,94,.28);
      color: #f8f1dd;
      display: none;
    }

    .status.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="kicker">Development Tool</div>
    <h1>Reset STEM Nation Test Data</h1>
    <p>
      Use this page during development when old uploaded images, names, avatar choices,
      observation notes, rankings, justifications, advisor reactions, or debriefs are carrying over.
    </p>

    <div class="keys" id="keyList"></div>

    <div class="actions">
      <button class="danger" type="button" onclick="resetStemNationData()">Reset Test Data</button>
      <a class="button primary" href="/academy_identity">Return to Academy Identity</a>
      <a class="button secondary" href="/student">Return to Student Landing</a>
    </div>

    <div class="status" id="statusBox"></div>
  </main>

  <script>
    const STEM_NATION_DEV_RESET_KEYS = [
      "stemNationStudentIdentity",
      "stemNationAcademyObservationV1",
      "stemNationQuestionPriorityRankingV1",
      "stemNationQuestionJustificationV1",
      "stemNationAdvisorReactionV1",
      "stemNationMissionDebriefV1",

      // Legacy / older keys that may still exist during testing.
      "STEM_NATION_BASELINE_INQUIRY_V1",
      "STEM_NATION_SETTLEMENT_DEFENSE_V1",
      "stemNationAcademyReadinessV1"
    ];

    const keyList = document.getElementById("keyList");
    const statusBox = document.getElementById("statusBox");

    function renderKeys() {
      keyList.innerHTML = STEM_NATION_DEV_RESET_KEYS
        .map(key => {
          const exists = localStorage.getItem(key) !== null;
          return `${exists ? "FOUND " : "empty "} ${key}`;
        })
        .join("<br>");
    }

    function resetStemNationData() {
      STEM_NATION_DEV_RESET_KEYS.forEach(key => localStorage.removeItem(key));

      statusBox.classList.add("show");
      statusBox.innerHTML = `
        <strong>Development test data cleared.</strong><br>
        Uploaded images, saved names, observations, rankings, justifications, reactions, and debrief data have been removed from this browser.
      `;

      renderKeys();
    }

    renderKeys();
  </script>
</body>
</html>
