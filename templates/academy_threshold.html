<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Threshold | STEM Nation</title>

  <style>
    /* THR_1_LIVING_AVATAR_THRESHOLD */

    :root {
      --gold: #f4d35e;
      --blue: #75dcff;
      --deep: #03101b;
      --text: #fff7dc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      color: var(--text);
      background: #020912;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .threshold {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(
          circle at 72% 39%,
          rgba(100, 214, 255, 0.23),
          transparent 19%
        ),
        linear-gradient(
          180deg,
          #102b45 0%,
          #071827 52%,
          #02070c 100%
        );
    }

    .sky {
      position: absolute;
      inset: 0;
      z-index: -8;
      overflow: hidden;
    }

    .sky::before,
    .sky::after {
      content: "";
      position: absolute;
      inset: -15%;
      pointer-events: none;
    }

    .sky::before {
      opacity: 0.34;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(117,220,255,.7) 1px, transparent 1px);
      background-size: 110px 110px, 180px 180px;
      animation: starDrift 45s linear infinite;
    }

    .sky::after {
      background:
        radial-gradient(
          ellipse at 65% 90%,
          rgba(59, 184, 224, 0.18),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          transparent 50%,
          rgba(1, 7, 13, 0.82)
        );
    }

    .mountains {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: 23%;
      height: 36%;
      z-index: -6;
      opacity: 0.78;
      clip-path: polygon(
        0 100%,
        0 60%,
        10% 39%,
        19% 58%,
        31% 22%,
        44% 56%,
        55% 30%,
        68% 56%,
        79% 26%,
        91% 57%,
        100% 37%,
        100% 100%
      );
      background:
        linear-gradient(
          180deg,
          rgba(57, 102, 137, 0.88),
          rgba(8, 26, 40, 0.95)
        );
      filter: blur(1px);
    }

    .academy {
      position: absolute;
      right: 7vw;
      bottom: 18vh;
      z-index: -3;
      width: min(38vw, 520px);
      height: min(58vh, 620px);
      min-width: 300px;
      min-height: 420px;
      filter: drop-shadow(0 35px 42px rgba(0,0,0,.48));
    }

    .academy-tower {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 36%;
      height: 100%;
      transform: translateX(-50%);
      clip-path: polygon(
        50% 0,
        72% 14%,
        72% 29%,
        89% 36%,
        89% 100%,
        11% 100%,
        11% 36%,
        28% 29%,
        28% 14%
      );
      border: 1px solid rgba(244,211,94,.28);
      background:
        linear-gradient(
          90deg,
          rgba(117,220,255,.08),
          rgba(255,255,255,.12),
          rgba(244,211,94,.06)
        ),
        #0b2438;
      box-shadow:
        inset 0 0 45px rgba(117,220,255,.11),
        0 0 36px rgba(117,220,255,.08);
    }

    .academy-wing {
      position: absolute;
      bottom: 0;
      width: 38%;
      height: 61%;
      border: 1px solid rgba(117,220,255,.18);
      background:
        linear-gradient(
          180deg,
          rgba(16, 57, 82, 0.95),
          rgba(5, 21, 33, 0.98)
        );
    }

    .academy-wing.left {
      left: 0;
      clip-path: polygon(0 19%, 100% 0, 100% 100%, 0 100%);
    }

    .academy-wing.right {
      right: 0;
      clip-path: polygon(0 0, 100% 19%, 100% 100%, 0 100%);
    }

    .academy-window {
      position: absolute;
      width: 10%;
      aspect-ratio: 0.55;
      border-radius: 999px 999px 5px 5px;
      background: rgba(112, 221, 255, 0.72);
      box-shadow:
        0 0 18px rgba(112,221,255,.68),
        0 0 44px rgba(112,221,255,.24);
      animation: windowPulse 3.8s ease-in-out infinite alternate;
    }

    .academy-window.one {
      top: 27%;
      left: 45%;
    }

    .academy-window.two {
      top: 46%;
      left: 28%;
      animation-delay: .7s;
    }

    .academy-window.three {
      top: 46%;
      right: 28%;
      animation-delay: 1.2s;
    }

    .gate {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 31%;
      height: 31%;
      transform: translateX(-50%);
      overflow: hidden;
      border: 2px solid rgba(244,211,94,.38);
      border-bottom: none;
      border-radius: 100px 100px 0 0;
      background:
        radial-gradient(
          ellipse at 50% 73%,
          rgba(117,220,255,.22),
          transparent 58%
        ),
        rgba(1, 10, 17, 0.94);
      box-shadow:
        inset 0 0 28px rgba(117,220,255,.12),
        0 0 32px rgba(244,211,94,.10);
      transition:
        background 700ms ease,
        box-shadow 700ms ease,
        border-color 700ms ease;
    }

    .gate::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: inherit;
      opacity: 0.15;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 11%,
          rgba(117,220,255,.55) 12% 13%
        );
      transform: scaleY(.9);
      transform-origin: bottom;
      transition:
        opacity 650ms ease,
        transform 900ms ease;
    }

    .gate.active {
      border-color: rgba(117,220,255,.92);
      background:
        radial-gradient(
          ellipse at 50% 69%,
          rgba(117,220,255,.75),
          rgba(49,151,205,.26) 45%,
          rgba(1,10,17,.88) 76%
        );
      box-shadow:
        inset 0 0 54px rgba(117,220,255,.42),
        0 0 44px rgba(117,220,255,.34),
        0 0 90px rgba(244,211,94,.14);
    }

    .gate.active::before {
      opacity: .76;
      transform: scaleY(1);
    }

    .ground {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: -4%;
      height: 34%;
      z-index: -1;
      clip-path: polygon(
        0 29%,
        27% 16%,
        49% 25%,
        67% 13%,
        100% 23%,
        100% 100%,
        0 100%
      );
      background:
        radial-gradient(
          ellipse at 70% 18%,
          rgba(244,211,94,.10),
          transparent 27%
        ),
        linear-gradient(
          180deg,
          #102638,
          #06111c 47%,
          #02070c
        );
    }

    .path {
      position: absolute;
      left: 25%;
      right: 12%;
      bottom: 2%;
      height: 30%;
      z-index: 0;
      clip-path: polygon(
        0 100%,
        13% 0,
        90% 0,
        100% 100%
      );
      opacity: 0.72;
      background:
        linear-gradient(
          90deg,
          rgba(11,25,35,.72),
          rgba(91,153,181,.26),
          rgba(11,25,35,.72)
        );
    }

    .path-lights {
      position: absolute;
      left: 28%;
      right: 16%;
      bottom: 8%;
      z-index: 1;
      height: 17%;
      opacity: .45;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 11%,
          rgba(117,220,255,.9) 11.4% 11.8%,
          transparent 12.2% 20%
        );
      filter: blur(.2px);
      transform: perspective(500px) rotateX(64deg);
      transform-origin: bottom;
      transition:
        opacity 500ms ease,
        filter 500ms ease;
    }

    .threshold.walking .path-lights,
    .threshold.gate-ready .path-lights {
      opacity: .95;
      filter:
        drop-shadow(0 0 8px rgba(117,220,255,.74))
        drop-shadow(0 0 18px rgba(244,211,94,.20));
    }

    .fog {
      position: absolute;
      bottom: 0;
      width: 65vw;
      height: 25vh;
      z-index: 2;
      opacity: .16;
      pointer-events: none;
      filter: blur(34px);
      background:
        radial-gradient(
          ellipse,
          rgba(117,220,255,.72),
          transparent 70%
        );
    }

    .fog.left {
      left: -24vw;
      animation: fogMove 15s ease-in-out infinite alternate;
    }

    .fog.right {
      right: -24vw;
      animation: fogMove 19s ease-in-out infinite alternate-reverse;
    }

    .top-hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding:
        max(18px, env(safe-area-inset-top))
        clamp(18px, 4vw, 54px);
      pointer-events: none;
    }

    .location {
      display: grid;
      gap: 4px;
      text-shadow: 0 3px 18px rgba(0,0,0,.8);
    }

    .location small {
      color: var(--gold);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .location strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 4vw, 3.8rem);
      line-height: 1;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border: 1px solid rgba(117,220,255,.32);
      border-radius: 999px;
      color: rgba(235,249,255,.78);
      background: rgba(4,22,35,.52);
      backdrop-filter: blur(10px);
      font-size: .78rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 12px rgba(117,220,255,.85);
      animation: statusPulse 1.6s ease-in-out infinite;
    }

    .instruction {
      position: absolute;
      left: 50%;
      bottom: clamp(24px, 5vh, 52px);
      z-index: 30;
      width: min(620px, calc(100% - 36px));
      transform: translateX(-50%);
      text-align: center;
      transition:
        opacity 350ms ease,
        transform 350ms ease;
    }

    .instruction.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(14px);
      pointer-events: none;
    }

    .instruction-label {
      display: block;
      margin-bottom: 11px;
      color: rgba(235,249,255,.68);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .approach-button {
      min-height: 54px;
      padding: 14px 24px;
      border: 1px solid rgba(244,211,94,.58);
      border-radius: 999px;
      color: #071624;
      background:
        linear-gradient(
          135deg,
          #67d9ff,
          #f4d35e
        );
      box-shadow:
        0 17px 42px rgba(0,0,0,.38),
        0 0 28px rgba(117,220,255,.18);
      cursor: pointer;
      font-weight: 950;
      letter-spacing: .04em;
      transition:
        transform 180ms ease,
        filter 180ms ease,
        box-shadow 180ms ease;
    }

    .approach-button:hover,
    .approach-button:focus-visible {
      transform: translateY(-3px);
      filter: brightness(1.06);
      box-shadow:
        0 21px 48px rgba(0,0,0,.42),
        0 0 34px rgba(244,211,94,.22);
      outline: none;
    }

    .student-character {
      position: absolute;
      left: 10vw;
      bottom: 14vh;
      z-index: 10;
      width: 130px;
      height: 255px;
      transform-origin: center bottom;
      transition:
        left 5.2s cubic-bezier(.35,.02,.28,1),
        bottom 5.2s cubic-bezier(.35,.02,.28,1),
        transform 5.2s cubic-bezier(.35,.02,.28,1);
      filter: drop-shadow(0 22px 18px rgba(0,0,0,.48));
    }

    .student-character.walking {
      left: 69vw;
      bottom: 17vh;
      transform: scale(.72);
    }

    .student-character.arrived {
      left: 69vw;
      bottom: 17vh;
      transform: scale(.72);
    }

    .character-shadow {
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 78px;
      height: 20px;
      transform: translateX(-50%);
      border-radius: 50%;
      opacity: .55;
      background: rgba(0,0,0,.62);
      filter: blur(7px);
    }

    .character-body {
      position: absolute;
      left: 50%;
      top: 74px;
      width: 67px;
      height: 118px;
      transform: translateX(-50%);
      border: 1px solid rgba(117,220,255,.35);
      border-radius: 32px 32px 20px 20px;
      background:
        linear-gradient(
          145deg,
          rgba(117,220,255,.24),
          rgba(244,211,94,.10)
        ),
        #102f49;
      box-shadow:
        inset 0 0 24px rgba(255,255,255,.05),
        0 0 24px rgba(117,220,255,.08);
    }

    .character-body::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 14px;
      width: 29px;
      height: 29px;
      transform: translateX(-50%) rotate(45deg);
      border: 1px solid rgba(244,211,94,.58);
      background: rgba(244,211,94,.10);
      box-shadow: 0 0 14px rgba(244,211,94,.18);
    }

    .character-head {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 5;
      width: 92px;
      height: 92px;
      transform: translateX(-50%);
      overflow: hidden;
      border: 2px solid rgba(244,211,94,.62);
      border-radius: 44% 44% 48% 48%;
      background: #0b263b;
      box-shadow:
        0 0 24px rgba(117,220,255,.18),
        0 12px 20px rgba(0,0,0,.28);
      animation: headIdle 3.2s ease-in-out infinite;
    }

    .character-head img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 20%;
    }

    .character-head-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 10px;
      color: var(--gold);
      font-size: .66rem;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
    }

    .character-arm,
    .character-leg {
      position: absolute;
      left: 50%;
      transform-origin: center top;
      border: 1px solid rgba(117,220,255,.25);
      background:
        linear-gradient(
          180deg,
          #173f5d,
          #0a2338
        );
    }

    .character-arm {
      top: 88px;
      z-index: -1;
      width: 20px;
      height: 93px;
      border-radius: 999px;
    }

    .character-arm.left {
      margin-left: -50px;
      transform: rotate(7deg);
    }

    .character-arm.right {
      margin-left: 30px;
      transform: rotate(-7deg);
    }

    .character-leg {
      top: 178px;
      z-index: -2;
      width: 25px;
      height: 72px;
      border-radius: 10px 10px 15px 15px;
    }

    .character-leg.left {
      margin-left: -31px;
    }

    .character-leg.right {
      margin-left: 6px;
    }

    .student-character.walking .character-body {
      animation: bodyWalk .56s ease-in-out infinite alternate;
    }

    .student-character.walking .character-head {
      animation: headWalk .56s ease-in-out infinite alternate;
    }

    .student-character.walking .character-arm.left {
      animation: armLeftWalk .56s ease-in-out infinite alternate;
    }

    .student-character.walking .character-arm.right {
      animation: armRightWalk .56s ease-in-out infinite alternate;
    }

    .student-character.walking .character-leg.left {
      animation: legLeftWalk .56s ease-in-out infinite alternate;
    }

    .student-character.walking .character-leg.right {
      animation: legRightWalk .56s ease-in-out infinite alternate;
    }

    .speech {
      position: absolute;
      left: 50%;
      top: -93px;
      z-index: 30;
      width: max-content;
      max-width: min(330px, 70vw);
      padding: 12px 15px;
      transform:
        translateX(-50%)
        translateY(10px);
      opacity: 0;
      pointer-events: none;
      border: 1px solid rgba(117,220,255,.48);
      border-radius: 16px;
      color: #ecfaff;
      background: rgba(4,24,38,.94);
      box-shadow:
        0 15px 40px rgba(0,0,0,.42),
        0 0 26px rgba(117,220,255,.14);
      font-size: .82rem;
      font-weight: 750;
      line-height: 1.4;
      text-align: center;
      transition:
        opacity 350ms ease,
        transform 350ms ease;
    }

    .speech::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9px;
      width: 16px;
      height: 16px;
      transform:
        translateX(-50%)
        rotate(45deg);
      border-right: 1px solid rgba(117,220,255,.48);
      border-bottom: 1px solid rgba(117,220,255,.48);
      background: rgba(4,24,38,.94);
    }

    .speech.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .mouth-light {
      position: absolute;
      left: 50%;
      top: 63px;
      z-index: 7;
      width: 18px;
      height: 5px;
      transform: translateX(-50%);
      opacity: 0;
      border-radius: 50%;
      background: rgba(117,220,255,.76);
      box-shadow: 0 0 10px rgba(117,220,255,.72);
    }

    .student-character.talking .mouth-light {
      opacity: .65;
      animation: mouthTalk .17s ease-in-out infinite alternate;
    }

    .nameplate {
      position: absolute;
      left: 50%;
      top: 253px;
      width: max-content;
      transform: translateX(-50%);
      padding: 5px 9px;
      border: 1px solid rgba(244,211,94,.28);
      border-radius: 999px;
      color: rgba(255,247,220,.88);
      background: rgba(2,13,22,.74);
      font-size: .65rem;
      font-weight: 900;
      letter-spacing: .07em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .transition-cover {
      position: absolute;
      inset: 0;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 71% 46%,
          rgba(117,220,255,.95),
          rgba(10,52,79,.84) 18%,
          #02070d 62%
        );
      transition: opacity 1200ms ease;
    }

    .transition-cover.show {
      opacity: 1;
    }

    .skip {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 40;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 999px;
      color: rgba(255,255,255,.62);
      background: rgba(1,9,15,.42);
      cursor: pointer;
      font-size: .72rem;
      backdrop-filter: blur(8px);
    }

    @keyframes starDrift {
      to {
        transform: translate(-70px, -130px);
      }
    }

    @keyframes fogMove {
      from {
        transform: translateX(-30px) scale(1);
      }

      to {
        transform: translateX(50px) scale(1.08);
      }
    }

    @keyframes windowPulse {
      from {
        opacity: .62;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes statusPulse {
      50% {
        opacity: .38;
        transform: scale(.78);
      }
    }

    @keyframes headIdle {
      0%,
      100% {
        transform: translateX(-50%) translateY(0) rotate(-1deg);
      }

      50% {
        transform: translateX(-50%) translateY(-3px) rotate(1deg);
      }
    }

    @keyframes bodyWalk {
      from {
        transform: translateX(-50%) translateY(0) rotate(-1deg);
      }

      to {
        transform: translateX(-50%) translateY(-5px) rotate(1deg);
      }
    }

    @keyframes headWalk {
      from {
        transform: translateX(-50%) translateY(0) rotate(-2deg);
      }

      to {
        transform: translateX(-50%) translateY(-7px) rotate(2deg);
      }
    }

    @keyframes armLeftWalk {
      from {
        transform: rotate(30deg);
      }

      to {
        transform: rotate(-30deg);
      }
    }

    @keyframes armRightWalk {
      from {
        transform: rotate(-30deg);
      }

      to {
        transform: rotate(30deg);
      }
    }

    @keyframes legLeftWalk {
      from {
        transform: rotate(20deg);
      }

      to {
        transform: rotate(-20deg);
      }
    }

    @keyframes legRightWalk {
      from {
        transform: rotate(-20deg);
      }

      to {
        transform: rotate(20deg);
      }
    }

    @keyframes mouthTalk {
      from {
        height: 3px;
        width: 15px;
      }

      to {
        height: 10px;
        width: 20px;
      }
    }

    @media (max-width: 760px) {
      .academy {
        right: -2vw;
        bottom: 20vh;
        width: 58vw;
        min-width: 270px;
        transform: scale(.88);
        transform-origin: right bottom;
      }

      .student-character {
        left: 4vw;
        bottom: 15vh;
        transform: scale(.83);
      }

      .student-character.walking,
      .student-character.arrived {
        left: 61vw;
        bottom: 18vh;
        transform: scale(.58);
      }

      .location strong {
        font-size: 1.75rem;
      }

      .status {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }

      .student-character {
        transition-duration: 900ms;
      }
    }
  </style>
</head>

<body>
  <main class="threshold" id="threshold">
    <div class="sky" aria-hidden="true"></div>
    <div class="mountains" aria-hidden="true"></div>

    <div class="academy" aria-hidden="true">
      <div class="academy-wing left"></div>
      <div class="academy-wing right"></div>
      <div class="academy-tower">
        <span class="academy-window one"></span>
        <span class="academy-window two"></span>
        <span class="academy-window three"></span>
        <div class="gate" id="academyGate"></div>
      </div>
    </div>

    <div class="ground" aria-hidden="true"></div>
    <div class="path" aria-hidden="true"></div>
    <div class="path-lights" aria-hidden="true"></div>

    <div class="fog left" aria-hidden="true"></div>
    <div class="fog right" aria-hidden="true"></div>

    <header class="top-hud">
      <div class="location">
        <small>STEM Nation Academy</small>
        <strong>The Threshold</strong>
      </div>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">New arrival detected</span>
      </div>
    </header>

    <section
      class="student-character"
      id="studentCharacter"
      aria-label="Your Academy avatar"
    >
      <div class="speech" id="studentSpeech">
        I am ready.
      </div>

      <div class="character-shadow"></div>

      <div class="character-arm left"></div>
      <div class="character-arm right"></div>

      <div class="character-leg left"></div>
      <div class="character-leg right"></div>

      <div class="character-body"></div>

      <div class="character-head" id="characterHead">
        <div class="character-head-fallback">
          Academy Avatar
        </div>
      </div>

      <span class="mouth-light" aria-hidden="true"></span>

      <div class="nameplate" id="studentNameplate">
        Academy Learner
      </div>
    </section>

    <section class="instruction" id="instruction">
      <span class="instruction-label" id="instructionLabel">
        Your first step inside STEM Nation
      </span>

      <button
        class="approach-button"
        id="approachButton"
        type="button"
      >
        Approach the Academy
      </button>
    </section>

    <button class="skip" id="skipButton" type="button">
      Skip Threshold
    </button>

    <div
      class="transition-cover"
      id="transitionCover"
      aria-hidden="true"
    ></div>
  </main>

  <script>
    const IDENTITY_KEY = "stemNationStudentIdentity";

    const threshold =
      document.getElementById("threshold");

    const character =
      document.getElementById("studentCharacter");

    const characterHead =
      document.getElementById("characterHead");

    const studentNameplate =
      document.getElementById("studentNameplate");

    const studentSpeech =
      document.getElementById("studentSpeech");

    const academyGate =
      document.getElementById("academyGate");

    const instruction =
      document.getElementById("instruction");

    const approachButton =
      document.getElementById("approachButton");

    const statusText =
      document.getElementById("statusText");

    const transitionCover =
      document.getElementById("transitionCover");

    const skipButton =
      document.getElementById("skipButton");

    let identity = {
      name: "Academy Learner",
      portrait: "",
      fallback: "",
      avatarChoice: "Academy Avatar"
    };

    try {
      const saved =
        JSON.parse(
          localStorage.getItem(IDENTITY_KEY) ||
          "null"
        );

      if (saved) {
        identity = {
          ...identity,
          ...saved
        };
      }
    } catch (error) {}

    function looksLikeImage(value) {
      return (
        typeof value === "string" &&
        (
          value.startsWith("/static/") ||
          value.startsWith("data:image/") ||
          value.startsWith("http://") ||
          value.startsWith("https://")
        )
      );
    }

    function resolveDisplayName(record) {
      return String(
        record.teacherApprovedName ||
        record.approvedName ||
        record.name ||
        "Academy Learner"
      )
        .replace(/^New Arrival\s*/i, "")
        .replace(/^Academy Learner\s*/i, "")
        .trim() || "Academy Learner";
    }

    function renderIdentity() {
      const name =
        resolveDisplayName(identity);

      const portrait =
        identity.portrait ||
        identity.fallback ||
        "";

      studentNameplate.textContent = name;

      characterHead.innerHTML = "";

      if (looksLikeImage(portrait)) {
        const image =
          document.createElement("img");

        image.src = portrait;
        image.alt = `${name} Academy avatar`;

        characterHead.appendChild(image);
      } else {
        const fallback =
          document.createElement("div");

        fallback.className =
          "character-head-fallback";

        fallback.textContent =
          identity.avatarChoice ||
          "Academy Avatar";

        characterHead.appendChild(fallback);
      }
    }

    function speak(text) {
      studentSpeech.textContent = text;
      studentSpeech.classList.add("show");
      character.classList.add("talking");

      if (
        "speechSynthesis" in window &&
        typeof SpeechSynthesisUtterance !== "undefined"
      ) {
        window.speechSynthesis.cancel();

        const utterance =
          new SpeechSynthesisUtterance(text);

        utterance.rate = 0.92;
        utterance.pitch = 1.04;
        utterance.volume = 0.88;

        utterance.onend = () => {
          character.classList.remove("talking");
        };

        utterance.onerror = () => {
          character.classList.remove("talking");
        };

        window.speechSynthesis.speak(utterance);
      } else {
        window.setTimeout(() => {
          character.classList.remove("talking");
        }, 1700);
      }
    }

    function enterCinematic() {
      transitionCover.classList.add("show");

      window.setTimeout(() => {
        window.location.href =
          "/academy_cinematic";
      }, 1050);
    }

    function beginThresholdSequence() {
      approachButton.disabled = true;
      instruction.classList.add("hidden");

      statusText.textContent =
        "Arrival approaching";

      threshold.classList.add("walking");
      character.classList.add("walking");

      window.setTimeout(() => {
        character.classList.remove("walking");
        character.classList.add("arrived");

        threshold.classList.remove("walking");
        threshold.classList.add("gate-ready");

        statusText.textContent =
          "Identity recognized";

        academyGate.classList.add("active");

        const displayName =
          resolveDisplayName(identity);

        speak(
          `I am ${displayName}. I am ready to enter STEM Nation.`
        );
      }, 5300);

      window.setTimeout(() => {
        studentSpeech.textContent =
          "The Academy is responding.";

        statusText.textContent =
          "Academy entry authorized";
      }, 7600);

      window.setTimeout(() => {
        enterCinematic();
      }, 9600);
    }

    approachButton.addEventListener(
      "click",
      beginThresholdSequence
    );

    skipButton.addEventListener(
      "click",
      enterCinematic
    );

    renderIdentity();

    window.setTimeout(() => {
      speak("The Academy is ahead.");
    }, 650);

    window.setTimeout(() => {
      studentSpeech.classList.remove("show");
    }, 2800);
  </script>
  <script src="{{ url_for('static', filename='js/academy_mission_record.js') }}?v=step2c1"></script>
</body>
</html>
